name: LoRagotchi Aquarium Preview
version: "0.3.0-preview.1"
slug: loragotchi_aquarium
description: Native LoRagotchi aquarium and operator controls streamed into Home Assistant
arch:
  - amd64
startup: application
boot: auto
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:fishbowl-outline
panel_title: Aquarium
panel_admin: true
environment:
  AQUARIUM_INGRESS: "1"
options:
  mode: demo
  demo_fish: 12
  width: 960
  height: 540
  fps: 20
  radio_host: ""
  radio_port: 5000
  radio_control: false
schema:
  mode: list(demo|live)
  demo_fish: int(0,256)
  width: int(320,1920)
  height: int(180,1080)
  fps: int(10,60)
  radio_host: str
  radio_port: port
  radio_control: bool
