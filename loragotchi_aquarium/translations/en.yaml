configuration:
  scene:
    name: Scenery style
    description: Tidal Garden is the new default reef with shaded animated seagrass. Choose classic for the original simpler scenery. Independent of themes and quality. Save and restart.
  theme_id:
    name: Theme ID
    description: current preserves existing Appearance settings. Choose classic, tropical, deep-sea, freshwater, moonlit, minimal or a custom library ID. Named theme fields replace corresponding Appearance values; theme_overrides win. Save and restart.
  fish_style:
    name: Fish style
    description: theme uses the selected theme's style; classic, rounded or faceted overrides it. Received colours and identity remain unchanged. Save and restart.
  theme_overrides:
    name: Theme overrides
    description: Optional aesthetic overrides applied after a named theme (or current Appearance). Manage custom themes at Web UI setup.html → Theme library. Saving library content does not change selection. Save and restart.
  mode:
    name: Connection mode
    description: Demo has synthetic fish. Home Assistant shares MeshCore's existing connection. Live is the optional dedicated MeshCoMod RX connection.
  ha_entry_id:
    name: MeshCore entry ID
    description: Leave empty to select the only companion. For multiple companions, copy the intended entry ID from the add-on log.
  ha_receive_fish:
    name: Receive fish through Home Assistant
    description: Enable durable fish capture and automatic returns. Off performs read-only connection diagnostics. Save and restart to apply.
  demo_fish:
    name: Demo fish count
    description: Number of synthetic visitors in demo mode only (0–256).
  width:
    name: Aquarium width
    description: Output width in pixels (320–1920). Save and restart to apply.
  height:
    name: Aquarium height
    description: Output height in pixels (180–1080). Match your dashboard card's aspect ratio.
  fps:
    name: Frame rate limit
    description: Maximum rendered frames per second (10–60). Lower values reduce host load. Overrides the preset's frame rate.
  graphics_preset:
    name: Graphics preset
    description: Sets render scale, fish detail, plants, bubbles, lighting and caustics. Optional overrides below take precedence. Save and restart to apply.
  render_scale:
    name: Render scale override
    description: Optional internal resolution multiplier (0.25–2). Omit for the preset value. Labels stay at output resolution.
  detail:
    name: Fish detail override
    description: Optional fish geometry detail (8–48). Omit for the preset value.
  plants:
    name: Plant count override
    description: Optional plant count (0–100). Omit for the preset value.
  bubbles:
    name: Bubble count override
    description: Optional bubble count (0–100). Omit for the preset value.
  lighting:
    name: Lighting override
    description: Optional scene lighting toggle. Omit for the preset value.
  caustics:
    name: Caustics override
    description: Optional animated water lighting toggle. Omit for the preset value.
  vsync:
    name: Vertical sync
    description: Off is recommended for the virtual display; frame rate is limited separately.
  chat_bubbles:
    name: Channel chat bubbles
    description: Display received channel messages above the water in dedicated live RX mode. HA MeshCore mode leaves chat in MeshCore Chat and does not forward channel messages.
  show_names:
    name: Fish name labels
    description: Show names above swimming fish.
  fish_lifespan_hours:
    name: Fish lifespan (hours)
    description: "0 disables expiry (default). Otherwise copies expire after this many hours since their last new share. Fractions allowed; 24 = one day, 168 = one week, maximum 8760. History is retained; original pets and returns are unchanged. Save and restart to apply."
  fish_animations:
    name: Arrival and departure animations
    description: Animate new fish, appearance updates and departures. This affects visuals only, not stored copies or radio returns.
  decorations:
    name: Seabed decorations
    description: Enable individual objects and their collision geometry. Save and restart to apply.
    fields:
      anchor:
        name: Old anchor
      clay-pots:
        name: Clay pots
      pirate-ship:
        name: Pirate ship wreck
      stone-arch:
        name: Ancient stone arch
      treasure-chest:
        name: Treasure chest
  exit_styles:
    name: Random departure styles
    description: Choose allowed exit animations. With every style off, fish swim up and out.
    fields:
      shark:
        name: Cartoon shark
      net:
        name: Fish net
      bag:
        name: Water bag
      bowl:
        name: Lift-out bowl
      cage:
        name: Open fish cage
  radio_host:
    name: Dedicated RX host
    description: Hostname or IP for legacy live mode only. Unused in Home Assistant mode.
  radio_port:
    name: Dedicated RX port
    description: TCP port for legacy live mode only (default 5000).
  radio_control:
    name: Legacy radio write permission
    description: Retained for existing configurations. No radio configuration UI is exposed by this add-on. Use MeshCore or MeshCore Chat for radio settings.
  nursery:
    name: Breeding cave and local nursery
    description: Optional local eggs only. Existing eggs survive disabling or a lower capacity. DX egg transfer is not connected.
    fields:
      enabled:
        name: Show breeding cave and nursery
      automatic:
        name: Automatically pair visiting adults
        description: Creates local eggs only when two unchanged adult visitors can reach the cave.
      capacity:
        name: Maximum stored eggs (1–12)
      cooldown_minutes:
        name: Rest between breeding for each parent (minutes)
  appearance:
    name: Appearance, day/night and bubble columns
    description: Save and restart to apply. Automatic lighting then runs continuously. Performance settings stay separate.
    fields:
      mode:
        name: "Lighting mode"
        description: "Static, clock schedule, or Home Assistant sun elevation. Sun unavailable falls back to the schedule."
      timezone:
        name: "Timezone"
        description: "ha uses Home Assistant timezone; or enter an IANA zone such as Europe/London. Missing HA timezone falls back to UTC with a log notice."
      day_start:
        name: "Day starts"
        description: "24-hour HH:MM. Dawn fade begins here. Overnight schedules are supported."
      night_start:
        name: "Night starts"
        description: "24-hour HH:MM. Dusk fade begins here."
      transition_minutes:
        name: "Fade minutes"
        description: "Clock fade duration; clamped to fit short day/night intervals."
      brightness:
        name: "Overall brightness"
        description: "Overall multiplier, 0–2. Zero deliberately blacks out the scene, not name labels."
      day_brightness:
        name: "Day brightness"
        description: "Daylight multiplier, also used by static mode."
      night_brightness:
        name: "Night brightness"
        description: "Night multiplier. Default 0.2 keeps fish visible; zero permits blackout."
      day_colour:
        name: "Day tint"
        description: "RGB tint in #RRGGBB; white preserves original fish colours."
      night_colour:
        name: "Night tint"
        description: "Night RGB tint in #RRGGBB; received fish data is unchanged."
      ambient_strength:
        name: "Ambient fill"
        description: "Ambient fill."
      surface_strength:
        name: "Surface light"
        description: "Surface light."
      fill_strength:
        name: "Side fill"
        description: "Side fill."
      surface_heading:
        name: "Light heading"
        description: "Light heading."
      surface_elevation:
        name: "Light elevation"
        description: "Light elevation."
      background_style:
        name: "Background"
        description: "Classic preserves the exact original gradient. Solid uses top colour; gradient uses both colours."
      background_top:
        name: "Top / solid colour"
        description: "Upper gradient or solid colour in #RRGGBB."
      background_bottom:
        name: "Bottom colour"
        description: "Lower gradient colour in #RRGGBB."
      fog_enabled:
        name: "Water fog"
        description: "Water fog."
      fog_colour:
        name: "Fog colour"
        description: "Use classic for original water colour, or #RRGGBB."
      fog_density:
        name: "Fog density"
        description: "Water depth haze density, 0–0.1; original 0.012."
      sand_tint:
        name: "Sand tint"
        description: "Multiply floor and shelf sand by #RRGGBB. White retains the original texture."
      caustics_strength:
        name: "Caustic strength"
        description: "Pattern opacity; requires the Caustics graphics option."
      caustics_speed:
        name: "Caustic speed"
        description: "Water-pattern speed multiplier; zero freezes movement."
      shafts:
        name: "Light shafts"
        description: "preset follows Caustics; on/off controls light shafts separately."
      shafts_strength:
        name: "Shaft strength"
        description: "Shaft strength."
      plant_sway:
        name: "Plant sway"
        description: "Plant sway multiplier; 0 disables this effect."
      plant_speed:
        name: "Sway speed"
        description: "Sway speed multiplier; 0 disables this effect."
      bubble_collisions:
        name: Bubble obstacle deflection
        description: Bubbles slide around solid scenery. Disable for a lighter renderer workload.
      bubble_dynamics:
        name: Varied bubble movement
      background_motion:
        name: Animated water pattern
        description: Off, soft light rays, or horizontal ripples behind the fish.
      background_speed:
        name: Water pattern speed
        description: Zero freezes the pattern; independent from caustics and day/night lighting.
      background_strength:
        name: Water pattern intensity
      fish_activity:
        name: Fish activity
        description: Off, gentle, or lively. Local movement only; never changes pet state.
      column_count:
        name: "Column count"
        description: "Requested columns (0–16). Zero disables columns, not ambient bubbles. Invalid sites are skipped."
      column_placement:
        name: "Placement"
        description: "Floor, generated shelves, or mixed. HA has no stacked-window shelves, so shelves-only places zero columns."
      column_seed:
        name: "Position seed"
        description: "Stable random position seed; change to reroll on Save + Restart."
      column_particles:
        name: "Total column bubbles"
        description: "Total column bubble pool (1–300), NOT per column. At most 100 ambient bubbles are additional."
      column_width:
        name: "Column spread"
        description: "Lateral spread in world units; clearance checks avoid solid objects."
      column_size:
        name: "Bubble size"
        description: "Bubble size multiplier."
      column_speed:
        name: "Rise speed"
        description: "Bubble rise speed multiplier."
